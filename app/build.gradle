plugins {
    alias(libs.plugins.android.application)
}

// 发布签名：优先读 local.properties（已被 .gitignore 排除，密钥口令不进仓库），
// 其次读环境变量；两者都没配时才回退 debug 签名，保证 clone 下来就能直接构建安装。
//
// local.properties 里写这四行（路径用正斜杠，避免 Properties 把 \ 当转义符）：
//   release.storeFile=E:/ProgrammingCode/Ratwl.keystore
//   release.storePassword=你的密钥库口令
//   release.keyAlias=你的别名
//   release.keyPassword=你的私钥口令（多数情况和密钥库口令相同）
def signingProps = new Properties()
def signingPropsFile = rootProject.file('local.properties')
if (signingPropsFile.exists()) {
    signingPropsFile.withInputStream { signingProps.load(it) }
}

def signingValue = { String propKey, String envKey ->
    def fromProp = signingProps.getProperty(propKey)
    if (fromProp != null && !fromProp.trim().isEmpty()) {
        return fromProp.trim()
    }
    def fromEnv = System.getenv(envKey)
    return (fromEnv != null && !fromEnv.trim().isEmpty()) ? fromEnv.trim() : null
}

def ksFile = signingValue('release.storeFile', 'RELEASE_STORE_FILE')
def ksStorePass = signingValue('release.storePassword', 'RELEASE_STORE_PASSWORD')
def ksAlias = signingValue('release.keyAlias', 'RELEASE_KEY_ALIAS')
def ksKeyPass = signingValue('release.keyPassword', 'RELEASE_KEY_PASSWORD')
def hasReleaseKeystore = ksFile && ksStorePass && ksAlias && ksKeyPass

logger.lifecycle(hasReleaseKeystore
        ? "签名：使用发布 keystore -> ${ksFile}（别名 ${ksAlias}）"
        : "签名：未配置发布 keystore，回退 debug 签名（仅自用，勿用于正式分发）")

android {
    namespace 'cn.ratwl.androidloginios'
    compileSdk 36

    defaultConfig {
        applicationId "cn.ratwl.androidloginios"
        minSdk 26
        targetSdk 36
        versionCode 28
        versionName "5.23"
    }

    signingConfigs {
        if (hasReleaseKeystore) {
            release {
                storeFile file(ksFile)
                storePassword ksStorePass
                keyAlias ksAlias
                keyPassword ksKeyPass
            }
        }
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            // 必须关掉 R8 混淆：容器（元萝卜 / PineXposed）会把模块的 dex 加载进**宿主** ClassLoader，
            // 混淆后的单字母类名（如 core.HookConfig -> "q"）会和容器自己的类撞名，
            // 运行时解析到容器那一份，直接 NoSuchMethodError。体积代价可忽略（< 300KB）。
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig hasReleaseKeystore ? signingConfigs.release : signingConfigs.debug
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildFeatures {
        buildConfig false
    }
    packaging {
        resources {
            excludes += ['META-INF/LICENSE*', 'META-INF/NOTICE*', 'META-INF/*.version', 'META-INF/*.kotlin_module']
        }
    }
    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    // 全部为编译期依赖：模块本身在宿主（游戏）进程里运行，Xposed API 由框架提供
    compileOnly files('libs/XposedBridgeAPI-82.jar')
}
